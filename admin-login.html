<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل دخول الإدارة - مؤسسة علي حسين</title>

    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="admin-login.css">
</head>

<body>

    <main class="admin-page">

        <section class="admin-section">

            <h1>تسجيل دخول الإدارة</h1>

            <p>سجّل الدخول للوصول إلى لوحة الإدارة.</p>

            <form id="loginForm">

                <label>
                    البريد الإلكتروني
                    <input
                        id="loginEmail"
                        type="email"
                        required
                        autocomplete="email"
                    >
                </label>

                <label>
                    كلمة المرور
                    <input
                        id="loginPassword"
                        type="password"
                        required
                        autocomplete="current-password"
                    >
                </label>

                <button type="submit">
                    تسجيل الدخول
                </button>

                <p id="loginMessage"></p>

            </form>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login.js"></script>

</body>

</html>
